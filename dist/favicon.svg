<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Blueprint-style crosshair favicon -->
  <rect width="32" height="32" rx="4" fill="#0a0e27"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="12" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
  <!-- Crosshair lines -->
  <line x1="4" y1="16" x2="12" y2="16" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="20" y1="16" x2="28" y2="16" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="16" y1="4" x2="16" y2="12" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="16" y1="20" x2="16" y2="28" stroke="#00e5ff" stroke-width="1.5"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#00e5ff"/>
  <!-- Corner marks -->
  <path d="M8 8 L8 11" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <path d="M8 8 L11 8" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <path d="M24 8 L24 11" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <path d="M24 8 L21 8" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <path d="M8 24 L8 21" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <path d="M8 24 L11 24" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <path d="M24 24 L24 21" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <path d="M24 24 L21 24" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
</svg>
